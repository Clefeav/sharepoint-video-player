<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>XR Feedback Video Player</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 1rem;
    }

    .player-shell {
      display: inline-flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .transport-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .transport-btn {
      position: relative;
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .transport-btn::after {
      content: attr(data-hotkey);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 0.35rem);
      transform: translateX(-50%) translateY(4px);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      font-size: 0.75rem;
      line-height: 1;
      padding: 0.35rem 0.5rem;
      border-radius: 0.35rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .transport-btn:hover,
    .transport-btn:focus-visible {
      background: rgba(0, 0, 0, 0.85);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .transport-btn:hover::after,
    .transport-btn:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .share-btn {
      background: #0a5a9c;
      margin-left: auto;
    }

    .share-btn:hover,
    .share-btn:focus-visible {
      background: #084a80;
    }

    .share-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: grid;
      place-items: center;
      padding: 1rem;
      z-index: 1000;
    }

    .share-overlay[hidden] {
      display: none;
    }

    .share-dialog {
      width: min(700px, 100%);
      background: #fff;
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }

    .share-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .share-title {
      margin: 0;
      font-size: 1.1rem;
    }

    .close-share-btn {
      border: 0;
      border-radius: 999px;
      width: 2rem;
      height: 2rem;
      background: #efefef;
      color: #111;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    .share-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .share-option-btn {
      border: 0;
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      background: #1f2937;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .share-option-btn:hover,
    .share-option-btn:focus-visible {
      background: #111827;
      outline: 2px solid #111;
      outline-offset: 2px;
    }

    .share-output {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .share-link-field {
      flex: 1;
      min-width: 0;
      border: 1px solid #c9c9c9;
      border-radius: 0.4rem;
      padding: 0.55rem 0.65rem;
      font-size: 0.9rem;
    }

    .copy-btn {
      border: 0;
      border-radius: 0.45rem;
      width: 2.25rem;
      height: 2.25rem;
      background: #0a5a9c;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .copy-btn:hover,
    .copy-btn:focus-visible {
      background: #084a80;
      outline: 2px solid #083e6a;
      outline-offset: 2px;
    }

    .share-status {
      margin: 0.65rem 0 0;
      font-size: 0.85rem;
      color: #1d4f13;
      min-height: 1.2em;
    }

    .share-status.error {
      color: #8f1d1d;
    }

    @media (max-width: 880px) {
      video {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <h2>Xbox Research Feedback Video Player</h2>

  <div class="player-shell">
    <video
      id="video"
      controls
      preload="auto"
      width="800"
      height="450"
    >
      <source id="source" src="" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <div class="transport-controls" aria-label="Video skip controls">
      <button
        id="rewind30Button"
        class="transport-btn"
        type="button"
        aria-label="Rewind 30 seconds"
        title="Rewind 30 seconds"
        data-hotkey="Shift+Left Arrow or U"
      >
        Rewind 30s
      </button>
      <button
        id="rewind10Button"
        class="transport-btn"
        type="button"
        aria-label="Rewind 10 seconds"
        title="Rewind 10 seconds (J / Left Arrow)"
        data-hotkey="Left Arrow or J"
      >
        Rewind 10s
      </button>
      <button
        id="forward10Button"
        class="transport-btn"
        type="button"
        aria-label="Fast forward 10 seconds"
        title="Fast forward 10 seconds"
        data-hotkey="Right Arrow or L"
      >
        Fast forward 10s
      </button>
      <button
        id="forward30Button"
        class="transport-btn"
        type="button"
        aria-label="Fast forward 30 seconds"
        title="Fast forward 30 seconds"
        data-hotkey="Shift+Right Arrow or O"
      >
        Fast forward 30s
      </button>
      <button
        id="createShareLinkButton"
        class="transport-btn share-btn"
        type="button"
        aria-label="Create share link"
        title="Create share link"
        data-hotkey="Build link"
      >
        Create share link
      </button>
    </div>
  </div>

  <div id="shareOverlay" class="share-overlay" hidden>
    <div class="share-dialog" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <div class="share-header">
        <h3 id="shareTitle" class="share-title">Create Share Link</h3>
        <button id="closeShareOverlayButton" class="close-share-btn" type="button" aria-label="Close">X</button>
      </div>
      <div class="share-options">
        <button id="linkStartButton" class="share-option-btn" type="button">Link to start of video</button>
        <button id="linkCurrentButton" class="share-option-btn" type="button">Link to current video time</button>
      </div>
      <div class="share-output">
        <input id="shareLinkField" class="share-link-field" type="text" readonly placeholder="Choose an option above to generate a link" aria-label="Share link URL" />
        <button id="copyShareLinkButton" class="copy-btn" type="button" aria-label="Copy share link" title="Copy share link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M16 1H4C2.9 1 2 1.9 2 3V15H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z" />
          </svg>
        </button>
      </div>
      <p id="shareStatus" class="share-status" aria-live="polite"></p>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const videoUrl = params.get("video");
      const seekTime = parseFloat(params.get("t")) || 0;
      const video = document.getElementById("video");
      const source = document.getElementById("source");
      const rewind30Button = document.getElementById("rewind30Button");
      const rewind10Button = document.getElementById("rewind10Button");
      const forward10Button = document.getElementById("forward10Button");
      const forward30Button = document.getElementById("forward30Button");
      const createShareLinkButton = document.getElementById("createShareLinkButton");
      const shareOverlay = document.getElementById("shareOverlay");
      const closeShareOverlayButton = document.getElementById("closeShareOverlayButton");
      const linkStartButton = document.getElementById("linkStartButton");
      const linkCurrentButton = document.getElementById("linkCurrentButton");
      const shareLinkField = document.getElementById("shareLinkField");
      const copyShareLinkButton = document.getElementById("copyShareLinkButton");
      const shareStatus = document.getElementById("shareStatus");
      let shouldResumePlaybackAfterShare = false;

      const activeVideoUrl = videoUrl || source.src || "";

      const seekBy = (seconds) => {
        const targetTime = video.currentTime + seconds;
        if (!Number.isFinite(video.duration) || video.duration <= 0) {
          video.currentTime = Math.max(0, targetTime);
          return;
        }

        video.currentTime = Math.min(Math.max(0, targetTime), video.duration);
      };

      rewind30Button.addEventListener("click", () => seekBy(-30));
      rewind10Button.addEventListener("click", () => seekBy(-10));
      forward10Button.addEventListener("click", () => seekBy(10));
      forward30Button.addEventListener("click", () => seekBy(30));

      const buildShareLink = (includeCurrentTime) => {
        if (!activeVideoUrl) {
          return "";
        }

        const shareUrl = new URL(window.location.href);
        shareUrl.search = "";
        const shareParams = new URLSearchParams();
        shareParams.set("video", activeVideoUrl);

        if (includeCurrentTime) {
          shareParams.set("t", String(Math.max(0, Math.floor(video.currentTime))));
        }

        shareUrl.search = shareParams.toString();
        return shareUrl.toString();
      };

      const showShareStatus = (message, isError) => {
        shareStatus.textContent = message;
        shareStatus.classList.toggle("error", Boolean(isError));
      };

      const openShareOverlay = () => {
        shouldResumePlaybackAfterShare = !video.paused && !video.ended;
        video.pause();
        shareOverlay.hidden = false;
        shareLinkField.value = "";
        showShareStatus("Select a link type to generate a URL.", false);
      };

      const closeShareOverlay = () => {
        shareOverlay.hidden = true;
        if (shouldResumePlaybackAfterShare) {
          shouldResumePlaybackAfterShare = false;
          video.play().catch(() => {
            showShareStatus("Playback resume was blocked by the browser.", true);
          });
        }
      };

      createShareLinkButton.addEventListener("click", openShareOverlay);
      closeShareOverlayButton.addEventListener("click", closeShareOverlay);

      shareOverlay.addEventListener("click", (event) => {
        if (event.target === shareOverlay) {
          closeShareOverlay();
        }
      });

      linkStartButton.addEventListener("click", () => {
        const link = buildShareLink(false);
        if (!link) {
          showShareStatus("No video URL is loaded yet.", true);
          return;
        }

        shareLinkField.value = link;
        shareLinkField.select();
        showShareStatus("Start link generated.", false);
      });

      linkCurrentButton.addEventListener("click", () => {
        const link = buildShareLink(true);
        if (!link) {
          showShareStatus("No video URL is loaded yet.", true);
          return;
        }

        shareLinkField.value = link;
        shareLinkField.select();
        showShareStatus("Current-time link generated.", false);
      });

      const copyShareLink = async () => {
        if (!shareLinkField.value) {
          showShareStatus("Generate a link before copying.", true);
          return;
        }

        try {
          await navigator.clipboard.writeText(shareLinkField.value);
          showShareStatus("Link copied to clipboard.", false);
          return;
        } catch (error) {
          shareLinkField.select();
          const copied = document.execCommand("copy");
          if (copied) {
            showShareStatus("Link copied to clipboard.", false);
          } else {
            showShareStatus("Could not copy automatically. Press Ctrl+C.", true);
          }
        }
      };

      copyShareLinkButton.addEventListener("click", copyShareLink);

      document.addEventListener("keydown", (event) => {
        if (!shareOverlay.hidden && event.key === "Escape") {
          event.preventDefault();
          closeShareOverlay();
          return;
        }

        if (!shareOverlay.hidden) {
          return;
        }

        const key = event.key.toLowerCase();
        if (event.shiftKey && key === "arrowleft") {
          event.preventDefault();
          seekBy(-30);
          return;
        }
        if (event.shiftKey && key === "arrowright") {
          event.preventDefault();
          seekBy(30);
          return;
        }
        if (key === "u") {
          event.preventDefault();
          seekBy(-30);
          return;
        }
        if (key === "o") {
          event.preventDefault();
          seekBy(30);
          return;
        }
        if (key === "arrowleft" || key === "j") {
          event.preventDefault();
          seekBy(-10);
          return;
        }
        if (key === "arrowright" || key === "l") {
          event.preventDefault();
          seekBy(10);
        }
      });

      if (videoUrl) {
        source.src = videoUrl;

        video.load();

        video.addEventListener("loadedmetadata", () => {
          if (seekTime > 0 && seekTime < video.duration) {
            video.currentTime = seekTime;
          }
          video.play().catch((e) => {
            console.warn("Autoplay may have been blocked:", e);
          });
        });
      } else {
        document.body.insertAdjacentHTML(
          "beforeend",
          "<p style='color:red;'>No video URL provided in ?video= parameter.</p>"
        );
      }
    });
  </script>
</body>
</html>
