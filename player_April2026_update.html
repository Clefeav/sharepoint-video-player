<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>XR Feedback Video Player</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 1rem;
    }

    .player-shell {
      display: inline-flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .transport-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .transport-btn {
      position: relative;
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .transport-btn::after {
      content: attr(data-hotkey);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 0.35rem);
      transform: translateX(-50%) translateY(4px);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      font-size: 0.75rem;
      line-height: 1;
      padding: 0.35rem 0.5rem;
      border-radius: 0.35rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .transport-btn:hover,
    .transport-btn:focus-visible {
      background: rgba(0, 0, 0, 0.85);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .transport-btn:hover::after,
    .transport-btn:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <h2>Xbox Research Feedback Video Player</h2>

  <div class="player-shell">
    <video
      id="video"
      controls
      preload="auto"
      width="800"
      height="450"
    >
      <source id="source" src="" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <div class="transport-controls" aria-label="Video skip controls">
      <button
        id="rewind30Button"
        class="transport-btn"
        type="button"
        aria-label="Rewind 30 seconds"
        title="Rewind 30 seconds"
        data-hotkey="Shift+Left Arrow or U"
      >
        Rewind 30s
      </button>
      <button
        id="rewind10Button"
        class="transport-btn"
        type="button"
        aria-label="Rewind 10 seconds"
        title="Rewind 10 seconds (J / Left Arrow)"
        data-hotkey="Left Arrow or J"
      >
        Rewind 10s
      </button>
      <button
        id="forward10Button"
        class="transport-btn"
        type="button"
        aria-label="Fast forward 10 seconds"
        title="Fast forward 10 seconds"
        data-hotkey="Right Arrow or L"
      >
        Fast forward 10s
      </button>
      <button
        id="forward30Button"
        class="transport-btn"
        type="button"
        aria-label="Fast forward 30 seconds"
        title="Fast forward 30 seconds"
        data-hotkey="Shift+Right Arrow or O"
      >
        Fast forward 30s
      </button>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const videoUrl = params.get("video");
      const seekTime = parseFloat(params.get("t")) || 0;
      const video = document.getElementById("video");
      const source = document.getElementById("source");
      const rewind30Button = document.getElementById("rewind30Button");
      const rewind10Button = document.getElementById("rewind10Button");
      const forward10Button = document.getElementById("forward10Button");
      const forward30Button = document.getElementById("forward30Button");

      const seekBy = (seconds) => {
        const targetTime = video.currentTime + seconds;
        if (!Number.isFinite(video.duration) || video.duration <= 0) {
          video.currentTime = Math.max(0, targetTime);
          return;
        }

        video.currentTime = Math.min(Math.max(0, targetTime), video.duration);
      };

      rewind30Button.addEventListener("click", () => seekBy(-30));
      rewind10Button.addEventListener("click", () => seekBy(-10));
      forward10Button.addEventListener("click", () => seekBy(10));
      forward30Button.addEventListener("click", () => seekBy(30));

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (event.shiftKey && key === "arrowleft") {
          event.preventDefault();
          seekBy(-30);
          return;
        }
        if (event.shiftKey && key === "arrowright") {
          event.preventDefault();
          seekBy(30);
          return;
        }
        if (key === "u") {
          event.preventDefault();
          seekBy(-30);
          return;
        }
        if (key === "o") {
          event.preventDefault();
          seekBy(30);
          return;
        }
        if (key === "arrowleft" || key === "j") {
          event.preventDefault();
          seekBy(-10);
          return;
        }
        if (key === "arrowright" || key === "l") {
          event.preventDefault();
          seekBy(10);
        }
      });

      if (videoUrl) {
        source.src = decodeURIComponent(videoUrl);

        video.load();

        video.addEventListener("loadedmetadata", () => {
          if (seekTime > 0 && seekTime < video.duration) {
            video.currentTime = seekTime;
          }
          video.play().catch((e) => {
            console.warn("Autoplay may have been blocked:", e);
          });
        });
      } else {
        document.body.insertAdjacentHTML(
          "beforeend",
          "<p style='color:red;'>No video URL provided in ?video= parameter.</p>"
        );
      }
    });
  </script>
</body>
</html>
